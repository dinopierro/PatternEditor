<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 755" width="940" height="755" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="755" fill="#ffffff"/>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ef5"/></marker></defs>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figura 12 — Il ciclo di una sessione di modifica</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">La modifica è transazionale: o si conferma tutta, o non è mai avvenuta.</text>
  <rect x="51.0" y="84.0" width="150.0" height="34.0" rx="7" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.4"/>
  <text x="126.0" y="99.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="middle">PatternsPage</text>
  <text x="126.0" y="111.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="middle">(host)</text>
  <rect x="223.0" y="84.0" width="150.0" height="34.0" rx="7" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.4"/>
  <text x="298.0" y="106.0" font-size="9.5" fill="#1b2430" font-weight="700" text-anchor="middle">PatternEditor</text>
  <rect x="395.0" y="84.0" width="150.0" height="34.0" rx="7" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.4"/>
  <text x="470.0" y="106.0" font-size="9.5" fill="#1b2430" font-weight="700" text-anchor="middle">PatternSerializer</text>
  <rect x="567.0" y="84.0" width="150.0" height="34.0" rx="7" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.4"/>
  <text x="642.0" y="99.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="middle">Macchina</text>
  <text x="642.0" y="111.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="middle">a stati</text>
  <rect x="739.0" y="84.0" width="150.0" height="34.0" rx="7" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.4"/>
  <text x="814.0" y="106.0" font-size="9.5" fill="#1b2430" font-weight="700" text-anchor="middle">API</text>
  <line x1="126.0" y1="118.0" x2="126.0" y2="614.0" stroke="#ccd3db" stroke-width="1.1" stroke-dasharray="4 4"/>
  <line x1="298.0" y1="118.0" x2="298.0" y2="614.0" stroke="#ccd3db" stroke-width="1.1" stroke-dasharray="4 4"/>
  <line x1="470.0" y1="118.0" x2="470.0" y2="614.0" stroke="#ccd3db" stroke-width="1.1" stroke-dasharray="4 4"/>
  <line x1="642.0" y1="118.0" x2="642.0" y2="614.0" stroke="#ccd3db" stroke-width="1.1" stroke-dasharray="4 4"/>
  <line x1="814.0" y1="118.0" x2="814.0" y2="614.0" stroke="#ccd3db" stroke-width="1.1" stroke-dasharray="4 4"/>
  <path d="M 130.0 144.0 L 294.0 144.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="212.0" y="137.0" font-size="9" fill="#1b2430" font-weight="600" text-anchor="middle">Pattern = l'originale dell'elenco</text>
  <path d="M 302.0 186.0 L 466.0 186.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="384.0" y="179.0" font-size="9" fill="#1b2430" font-weight="600" text-anchor="middle">Serialize(originale) → Deserialize</text>
  <path d="M 466.0 228.0 L 302.0 228.0" fill="none" stroke="#6b7684" stroke-width="1.6" marker-end="url(#punta)" stroke-dasharray="5 4"/>
  <text x="384.0" y="221.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="middle">copia profonda, indipendente</text>
  <path d="M 302.0 270.0 L 638.0 270.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="470.0" y="263.0" font-size="9" fill="#1b2430" font-weight="600" text-anchor="middle">OpenExisting()</text>
  <path d="M 298.0 306.0 L 332.0 306.0 L 332.0 320.0 L 302.0 320.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="340.0" y="314.0" font-size="9" fill="#1b2430" font-weight="400" text-anchor="start">… n modifiche: MarkDirty, Validate, ridisegna …</text>
  <path d="M 130.0 348.0 L 294.0 348.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="212.0" y="341.0" font-size="9" fill="#1b2430" font-weight="600" text-anchor="middle">Chiudi / Conferma</text>
  <path d="M 302.0 390.0 L 638.0 390.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="470.0" y="383.0" font-size="9" fill="#1b2430" font-weight="600" text-anchor="middle">BeginConfirm()</text>
  <path d="M 298.0 426.0 L 332.0 426.0 L 332.0 440.0 L 302.0 440.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="340.0" y="434.0" font-size="9" fill="#1b2430" font-weight="400" text-anchor="start">Validate(copia): se non è valida si ferma qui</text>
  <path d="M 302.0 468.0 L 638.0 468.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="470.0" y="461.0" font-size="9" fill="#1b2430" font-weight="600" text-anchor="middle">CompleteConfirm(valido)</text>
  <path d="M 294.0 510.0 L 130.0 510.0" fill="none" stroke="#6b7684" stroke-width="1.6" marker-end="url(#punta)" stroke-dasharray="5 4"/>
  <text x="212.0" y="503.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="middle">OnConfirm(copia modificata)</text>
  <path d="M 130.0 552.0 L 810.0 552.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="470.0" y="545.0" font-size="9" fill="#1b2430" font-weight="600" text-anchor="middle">PUT /api/patterns/{id}</text>
  <path d="M 810.0 594.0 L 130.0 594.0" fill="none" stroke="#6b7684" stroke-width="1.6" marker-end="url(#punta)" stroke-dasharray="5 4"/>
  <text x="470.0" y="587.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="middle">204 · l'elenco si ricarica</text>
  <rect x="40.0" y="652.0" width="860.0" height="79.0" rx="6" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="50.0" y="669.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">Annulla percorre lo stesso tracciato fino a OnCancel: la copia viene buttata e l'originale non è mai stato toccato, perché nessun</text>
  <text x="50.0" y="682.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">passaggio ha mai scritto su di lui. È questo che rende «Annulla» una promessa e non una speranza.</text>
  <text x="50.0" y="695.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start"></text>
  <text x="50.0" y="708.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">La copia si ottiene serializzando e rideserializzando l'originale. Sembra un giro largo rispetto a un metodo Copia(), e invece è il modo</text>
  <text x="50.0" y="721.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">più sicuro: passa dallo stesso codice della persistenza, quindi copia anche gli elementi di tipi che questa installazione non conosce.</text>
</svg>
