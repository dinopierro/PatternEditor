<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1b2430">Figura 8 — Disposizione per schermo stretto</text>
  <text x="40" y="64" font-size="13" fill="#6b7684">Fino a 1024 px: tre fasce fisse al posto di tre colonne. A scorrere e' solo il foglio in fondo.</text>

  <!-- ============================== il telefono ============================== -->
  <rect x="40" y="90" width="250" height="440" rx="18" fill="#ffffff" stroke="#ccd3db" stroke-width="1.6"/>

  <!-- fascia 1: barra -->
  <rect x="40" y="90" width="250" height="44" rx="18" fill="#fbfcfd"/>
  <rect x="40" y="116" width="250" height="18" fill="#fbfcfd"/>
  <line x1="40" y1="134" x2="290" y2="134" stroke="#e3e6ea"/>
  <rect x="52" y="101" width="104" height="22" rx="5" fill="#ffffff" stroke="#ccd3db"/>
  <text x="60" y="116" font-size="9.5" fill="#1b2430">Mattoni</text>
  <rect x="164" y="101" width="52" height="22" rx="5" fill="#ffffff" stroke="#ccd3db"/>
  <text x="190" y="116" font-size="9" fill="#1b2430" text-anchor="middle">Annulla</text>
  <rect x="222" y="101" width="56" height="22" rx="5" fill="#3b6ef5"/>
  <text x="250" y="116" font-size="9" fill="#ffffff" text-anchor="middle">Conferma</text>

  <!-- fascia 2: anteprima ancorata -->
  <rect x="40" y="134" width="250" height="132" fill="#f6f7f9"/>
  <text x="52" y="150" font-size="8" font-weight="700" fill="#6b7684" letter-spacing="1">RIPETIZIONE</text>
  <text x="278" y="150" font-size="8" fill="#6b7684" text-anchor="end">50 &#215; 50</text>
  <rect x="52" y="157" width="226" height="100" rx="5" fill="#ffffff" stroke="#ccd3db"/>
  <g fill="#dc1822" opacity="0.85">
    <rect x="60" y="165" width="28" height="12"/><rect x="94" y="165" width="28" height="12"/><rect x="128" y="165" width="28" height="12"/><rect x="162" y="165" width="28" height="12"/><rect x="196" y="165" width="28" height="12"/><rect x="230" y="165" width="28" height="12"/>
    <rect x="60" y="183" width="18" height="12"/><rect x="84" y="183" width="28" height="12"/><rect x="118" y="183" width="28" height="12"/><rect x="152" y="183" width="28" height="12"/><rect x="186" y="183" width="28" height="12"/><rect x="220" y="183" width="38" height="12"/>
    <rect x="60" y="201" width="28" height="12"/><rect x="94" y="201" width="28" height="12"/><rect x="128" y="201" width="28" height="12"/><rect x="162" y="201" width="28" height="12"/><rect x="196" y="201" width="28" height="12"/><rect x="230" y="201" width="28" height="12"/>
    <rect x="60" y="219" width="18" height="12"/><rect x="84" y="219" width="28" height="12"/><rect x="118" y="219" width="28" height="12"/><rect x="152" y="219" width="28" height="12"/><rect x="186" y="219" width="28" height="12"/><rect x="220" y="219" width="38" height="12"/>
    <rect x="60" y="237" width="28" height="12"/><rect x="94" y="237" width="28" height="12"/><rect x="128" y="237" width="28" height="12"/><rect x="162" y="237" width="28" height="12"/><rect x="196" y="237" width="28" height="12"/><rect x="230" y="237" width="28" height="12"/>
  </g>
  <line x1="40" y1="266" x2="290" y2="266" stroke="#e3e6ea"/>

  <!-- fascia 3: schede -->
  <rect x="40" y="266" width="250" height="30" fill="#fbfcfd"/>
  <text x="82" y="285" font-size="9.5" font-weight="600" fill="#3b6ef5" text-anchor="middle">Propriet&#224;</text>
  <rect x="46" y="294" width="72" height="2" fill="#3b6ef5"/>
  <text x="165" y="285" font-size="9.5" font-weight="600" fill="#6b7684" text-anchor="middle">Elementi</text>
  <text x="248" y="285" font-size="9.5" font-weight="600" fill="#6b7684" text-anchor="middle">SVG</text>
  <line x1="40" y1="296" x2="290" y2="296" stroke="#e3e6ea"/>

  <!-- fascia 4: foglio -->
  <text x="52" y="315" font-size="9.5" font-weight="600" fill="#1b2430">Cella</text>
  <text x="52" y="331" font-size="8.5" fill="#6b7684">Larghezza [px]</text>
  <rect x="52" y="336" width="226" height="26" rx="5" fill="#ffffff" stroke="#ccd3db"/>
  <text x="60" y="353" font-size="10" fill="#1b2430">50</text>
  <text x="52" y="378" font-size="8.5" fill="#6b7684">Altezza [px]</text>
  <rect x="52" y="383" width="226" height="26" rx="5" fill="#ffffff" stroke="#ccd3db"/>
  <text x="60" y="400" font-size="10" fill="#1b2430">50</text>
  <text x="52" y="428" font-size="8.5" fill="#6b7684">Scala [%]</text>
  <rect x="52" y="437" width="226" height="6" rx="3" fill="#e3e6ea"/><circle cx="120" cy="440" r="7" fill="#3b6ef5"/>
  <rect x="52" y="452" width="226" height="26" rx="5" fill="#ffffff" stroke="#ccd3db"/>
  <text x="60" y="469" font-size="10" fill="#1b2430">100</text>
  <!-- barra di scorrimento del solo foglio -->
  <rect x="283" y="302" width="3" height="90" rx="1.5" fill="#ccd3db"/>

  <!-- piede -->
  <line x1="40" y1="500" x2="290" y2="500" stroke="#e3e6ea"/>
  <rect x="40" y="500" width="250" height="30" rx="18" fill="#fbfcfd"/>
  <rect x="40" y="500" width="250" height="14" fill="#fbfcfd"/>
  <text x="52" y="519" font-size="7.5" fill="#6b7684">Creato 10/09 09:41 &#183; Modificato 10/09 11:49</text>

  <!-- ============================== annotazioni ============================== -->
  <g font-size="12" fill="#1b2430">
    <line x1="290" y1="112" x2="330" y2="112" stroke="#3b6ef5" stroke-width="1.4"/>
    <circle cx="344" cy="112" r="11" fill="#3b6ef5"/><text x="344" y="116" font-size="11" fill="#ffffff" text-anchor="middle">1</text>
    <text x="364" y="109" font-weight="650">Le decisioni restano in alto</text>
    <text x="364" y="126" font-size="11.5" fill="#6b7684">Annulla, nome e conferma in una barra che non scorre.</text>

    <line x1="290" y1="200" x2="330" y2="200" stroke="#3b6ef5" stroke-width="1.4"/>
    <circle cx="344" cy="200" r="11" fill="#3b6ef5"/><text x="344" y="204" font-size="11" fill="#ffffff" text-anchor="middle">2</text>
    <text x="364" y="190" font-weight="650">L'anteprima non scorre mai</text>
    <text x="364" y="207" font-size="11.5" fill="#6b7684">Resta la sola ripetizione: affiancarle anche la cella</text>
    <text x="364" y="223" font-size="11.5" fill="#6b7684">singola darebbe due francobolli invece di un'anteprima.</text>

    <line x1="290" y1="281" x2="330" y2="281" stroke="#3b6ef5" stroke-width="1.4"/>
    <circle cx="344" cy="281" r="11" fill="#3b6ef5"/><text x="344" y="285" font-size="11" fill="#ffffff" text-anchor="middle">3</text>
    <text x="364" y="271" font-weight="650">Tre schede al posto di tre colonne</text>
    <text x="364" y="288" font-size="11.5" fill="#6b7684">Stessi pannelli, uno alla volta. Il dettaglio di un</text>
    <text x="364" y="304" font-size="11.5" fill="#6b7684">elemento sostituisce l'elenco, come su schermo largo.</text>

    <line x1="290" y1="400" x2="330" y2="400" stroke="#3b6ef5" stroke-width="1.4"/>
    <circle cx="344" cy="400" r="11" fill="#3b6ef5"/><text x="344" y="404" font-size="11" fill="#ffffff" text-anchor="middle">4</text>
    <text x="364" y="390" font-weight="650">Scorre solo il foglio</text>
    <text x="364" y="407" font-size="11.5" fill="#6b7684">Un campo per riga, cursore sopra il suo numero,</text>
    <text x="364" y="423" font-size="11.5" fill="#6b7684">comandi da 44 px e testo da 16 px.</text>
  </g>

  <rect x="364" y="452" width="536" height="62" rx="8" fill="#fbfcfd" stroke="#e3e6ea"/>
  <text x="380" y="472" font-size="11.5" font-weight="650" fill="#1b2430">Due disposizioni, nessuna via di mezzo</text>
  <text x="380" y="490" font-size="11.5" fill="#6b7684">Fino a 1024 px le fasce; da 1025 px le tre colonne. Una disposizione intermedia a due</text>
  <text x="380" y="506" font-size="11.5" fill="#6b7684">colonne lasciava fuori vista, all'apertura, sia le proprieta' sia gli elementi.</text>
</svg>
