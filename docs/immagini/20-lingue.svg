<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 657" width="940" height="657" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="657" fill="#ffffff"/>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ef5"/></marker></defs>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figura 20 — Le due lingue e i due cataloghi</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">Chi decide in che lingua si parla, da dove arrivano le parole, e che cosa succede quando ne manca una.</text>
  <rect x="30.0" y="84.0" width="270.0" height="210.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="42.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">1 · Come si decide la lingua</text>
  <text x="42.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">una volta sola, dopo il primo</text>
  <text x="42.0" y="136.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">disegno: prima non c'è JavaScript</text>
  <text x="42.0" y="158.0" font-size="9" fill="#3b6ef5" font-weight="700" text-anchor="start">1.</text>
  <text x="58.0" y="158.0" font-size="8.8" fill="#1b2430" font-weight="400" text-anchor="start">la scelta fatta a mano, se c'è stata</text>
  <text x="58.0" y="171.0" font-size="8.2" fill="#6b7684" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">localStorage — vince su tutto</text>
  <text x="42.0" y="191.0" font-size="9" fill="#3b6ef5" font-weight="700" text-anchor="start">2.</text>
  <text x="58.0" y="191.0" font-size="8.8" fill="#1b2430" font-weight="400" text-anchor="start">la lingua del browser, se la sappiamo</text>
  <text x="58.0" y="204.0" font-size="8.2" fill="#6b7684" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">navigator.languages[0] → it-IT → it</text>
  <text x="42.0" y="224.0" font-size="9" fill="#3b6ef5" font-weight="700" text-anchor="start">3.</text>
  <text x="58.0" y="224.0" font-size="8.8" fill="#1b2430" font-weight="400" text-anchor="start">l'inglese, che c'è sempre</text>
  <text x="42.0" y="250.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Il cambio dal selettore è immediato: si</text>
  <text x="42.0" y="262.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">sostituisce un dizionario e si ridisegna,</text>
  <text x="42.0" y="274.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">senza ricaricare la pagina.</text>
  <rect x="345.0" y="84.0" width="290.0" height="96.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="357.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">2a · Catalogo dell'applicazione</text>
  <text x="357.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">wwwroot/i18n/{en,it}.json</text>
  <text x="357.0" y="136.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">le pagine, l'accesso, la libreria</text>
  <text x="357.0" y="158.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">servito dall'applicazione stessa</text>
  <rect x="345.0" y="198.0" width="290.0" height="96.0" rx="8" fill="#edf8f2" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="357.0" y="218.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">2b · Catalogo dell'editor</text>
  <text x="357.0" y="236.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">_content/PatternEditor/i18n/it.json</text>
  <text x="357.0" y="250.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">risorsa statica della libreria</text>
  <text x="357.0" y="272.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">l'editor, i nove plugin, i filtri</text>
  <path d="M 300.0 132.0 L 345.0 132.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="322.5" y="127.0" font-size="8.5" fill="#3b6ef5" font-weight="600" text-anchor="middle">carica</text>
  <path d="M 300.0 246.0 L 345.0 246.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="322.5" y="241.0" font-size="8.5" fill="#3b6ef5" font-weight="600" text-anchor="middle">applica</text>
  <rect x="680.0" y="84.0" width="230.0" height="210.0" rx="8" fill="#fff6ec" stroke="#c2701c" stroke-width="1.5"/>
  <text x="692.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">3 · L'inglese della libreria</text>
  <text x="692.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">PatternEditor.Abstractions</text>
  <text x="692.0" y="136.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">risorsa incorporata nell'assembly</text>
  <text x="692.0" y="162.0" font-size="8.6" fill="#c2701c" font-weight="700" text-anchor="start">Non una lingua privilegiata:</text>
  <text x="692.0" y="175.0" font-size="8.6" fill="#c2701c" font-weight="700" text-anchor="start">la rete di sicurezza.</text>
  <text x="692.0" y="198.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Un ospite che non applichi niente</text>
  <text x="692.0" y="210.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">— perché è a lingua singola,</text>
  <text x="692.0" y="222.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">perché il file non è arrivato —</text>
  <text x="692.0" y="234.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">trova un editor che parla, non un</text>
  <text x="692.0" y="246.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">editor pieno di sigle.</text>
  <path d="M 635.0 246.0 L 680.0 246.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="657.5" y="258.0" font-size="8.5" fill="#3b6ef5" font-weight="600" text-anchor="middle">ripiega su</text>
  <rect x="30.0" y="320.0" width="880.0" height="96.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="42.0" y="340.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">4 · Il ripiego è per chiave, non per catalogo</text>
  <text x="46.0" y="364.0" font-size="8.8" fill="#1b2430" font-weight="700" text-anchor="start">il catalogo applicato</text>
  <text x="46.0" y="380.0" font-size="8.4" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">editor.conferma → «Conferma»</text>
  <text x="338.0" y="364.0" font-size="8.8" fill="#1b2430" font-weight="700" text-anchor="start">se non ce l'ha: l'inglese</text>
  <text x="338.0" y="380.0" font-size="8.4" fill="#3b6ef5" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">editor.conferma → «Confirm»</text>
  <text x="630.0" y="364.0" font-size="8.8" fill="#1b2430" font-weight="700" text-anchor="start">se non c'è nemmeno lì</text>
  <text x="630.0" y="380.0" font-size="8.4" fill="#c2701c" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">si legge editor.conferma</text>
  <text x="46.0" y="402.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Una traduzione incompleta lascia scoperte le parole che le mancano, non l'interfaccia intera. E una chiave sbagliata si legge a schermo: è brutto, e si nota.</text>
  <rect x="30.0" y="436.0" width="430.0" height="128.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="42.0" y="456.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">5a · Il testo che nasce nell'interfaccia</text>
  <text x="42.0" y="474.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">un'etichetta, un pulsante, una nota</text>
  <text x="42.0" y="498.0" font-size="8.6" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">E["editor.conferma"]</text>
  <text x="42.0" y="520.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">La chiave sta scritta nel markup: il componente</text>
  <text x="42.0" y="532.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">chiede al catalogo e mostra quello che riceve.</text>
  <rect x="480.0" y="436.0" width="430.0" height="128.0" rx="8" fill="#edf8f2" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="492.0" y="456.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">5b · Il testo che nasce nel modello</text>
  <text x="492.0" y="474.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">un riassunto del filtro, un messaggio del validatore</text>
  <text x="492.0" y="498.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">new TestoNominato("filtro.sfocatura.raggio",</text>
  <text x="492.0" y="511.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">                  "radius {0}", 2.5)</text>
  <text x="492.0" y="532.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Il modello sa che cosa dire — quale caso, quali numeri —</text>
  <text x="492.0" y="544.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">e non in che lingua: quella la decide chi mostra.</text>
  <rect x="30.0" y="580.0" width="880.0" height="53.0" rx="6" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40.0" y="597.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">Le chiavi che si compongono a runtime — «tipo.rect» da un plugin, «preset.seppia» da un effetto, «filtro.feBlend» da un nome SVG —</text>
  <text x="40.0" y="610.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">ripiegano sul nome che l'oggetto porta con sé, non sulla chiave: un plugin scritto da qualcun altro non è nei nostri cataloghi, e non</text>
  <text x="40.0" y="623.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">ha motivo di esserci. Aggiungere una lingua è aggiungere due file e una riga nell'elenco: nessuna ricompilazione.</text>
</svg>
