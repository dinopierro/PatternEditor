<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="570" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figure 8 — Fitting an image</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">preserveAspectRatio: what happens when the proportions do not match.</text>
  <text x="30" y="88" font-size="12" fill="#6b7684" font-weight="400" text-anchor="start">The starting image is wide and short; the frame that holds it is square.</text>
  <text x="30" y="126" font-size="12" fill="#3b6ef5" font-weight="700" text-anchor="start">meet</text>
  <text x="82" y="126" font-size="11" fill="#1b2430" font-weight="400" text-anchor="start">— contains all of it</text>
  <rect x="30" y="136" width="180" height="180" rx="4" fill="#eef1f5" stroke="#ccd3db" stroke-width="1"/>
  <rect x="30" y="196" width="180" height="60" fill="#1f9d6b" opacity=".85"/>
  <circle cx="80" cy="226" r="18" fill="#f4c14b"/>
  <text x="30" y="336" font-size="10.5" fill="#6b7684" font-weight="400" text-anchor="start">leaves empty space at the sides</text>
  <text x="330" y="126" font-size="12" fill="#3b6ef5" font-weight="700" text-anchor="start">slice</text>
  <text x="382" y="126" font-size="11" fill="#1b2430" font-weight="400" text-anchor="start">— fills the frame</text>
  <rect x="330" y="136" width="180" height="180" rx="4" fill="#eef1f5" stroke="#ccd3db" stroke-width="1"/>
  <clipPath id="s1"><rect x="330" y="136" width="180" height="180"/></clipPath>
  <g clip-path="url(#s1)"><rect x="150" y="136" width="540" height="180" fill="#1f9d6b" opacity=".85"/><circle cx="360" cy="226" r="54" fill="#f4c14b"/></g>
  <text x="330" y="336" font-size="10.5" fill="#6b7684" font-weight="400" text-anchor="start">cuts off what is left over</text>
  <text x="630" y="126" font-size="12" fill="#3b6ef5" font-weight="700" text-anchor="start">none</text>
  <text x="682" y="126" font-size="11" fill="#1b2430" font-weight="400" text-anchor="start">— makes it match</text>
  <rect x="630" y="136" width="180" height="180" rx="4" fill="#eef1f5" stroke="#ccd3db" stroke-width="1"/>
  <rect x="630" y="136" width="180" height="180" fill="#1f9d6b" opacity=".85"/>
  <ellipse cx="680" cy="226" rx="18" ry="54" fill="#f4c14b"/>
  <text x="630" y="336" font-size="10.5" fill="#6b7684" font-weight="400" text-anchor="start">distorts it</text>
  <rect x="30" y="366" width="880" height="190" rx="8" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <text x="52" y="394" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">There is no absolutely right choice: you choose what you are willing to lose. With meet you lose</text>
  <text x="52" y="415" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">nothing of the image but accept some empty space; with slice the frame is full but the edges</text>
  <text x="52" y="436" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">of the image fall outside the frame; with none everything is there and the frame is full, but the shapes are</text>
  <text x="52" y="457" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">stretched — on a face or a logo it shows immediately.</text>
  <text x="52" y="478" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start"></text>
  <text x="52" y="499" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">In the editor the preview of the three modes deliberately uses a non-square frame: on a square frame,</text>
  <text x="52" y="520" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">with a square image, the three modes would give the same result and could not be told apart.</text>

</svg>
