<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="570" fill="#ffffff"/>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ef5"/></marker></defs>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figure 5 — The coordinate system</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">Two things that in SVG work the opposite way round from what you expect.</text>
  <text x="30" y="92" font-size="12" fill="#1b2430" font-weight="650" text-anchor="start">1. The Y axis grows DOWNWARDS</text>
  <rect x="30" y="104" width="300" height="230" rx="4" fill="#fbfcfd" stroke="#ccd3db" stroke-width="1"/>
  <line x1="60" y1="130" x2="60" y2="310" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#punta)"/>
  <line x1="60" y1="130" x2="300" y2="130" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#punta)"/>
  <text x="66" y="126" font-size="9" fill="#3b6ef5" font-weight="600" text-anchor="start">(0,0) origine</text>
  <text x="306" y="134" font-size="11" fill="#3b6ef5" font-weight="700" text-anchor="start">X</text>
  <text x="50" y="320" font-size="11" fill="#3b6ef5" font-weight="700" text-anchor="start">Y</text>
  <rect x="120" y="180" width="90" height="60" fill="#dc1822" opacity=".85"/>
  <text x="124" y="174" font-size="9" fill="#1b2430" font-weight="400" text-anchor="start">x=60  y=50</text>
  <text x="40" y="356" font-size="11" fill="#6b7684" font-weight="400" text-anchor="start">Increasing Y moves the element down, not up.</text>
  <text x="400" y="92" font-size="12" fill="#1b2430" font-weight="650" text-anchor="start">2. Text sits on the BASELINE</text>
  <rect x="400" y="104" width="300" height="230" rx="4" fill="#fbfcfd" stroke="#ccd3db" stroke-width="1"/>
  <line x1="430" y1="240" x2="670" y2="240" stroke="#3b6ef5" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="440" y="240" font-size="46" fill="#dc1822" opacity=".85">Ago</text>
  <text x="430" y="258" font-size="9" fill="#3b6ef5" font-weight="600" text-anchor="start">baseline — this is where Y points</text>
  <text x="410" y="356" font-size="11" fill="#6b7684" font-weight="400" text-anchor="start">With y=0 the text ends up almost entirely above the edge.</text>
  <rect x="30" y="380" width="880" height="170" rx="8" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <text x="52" y="408" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">The coordinates of elements are in the units of the cell, not in screen pixels: in a cell of</text>
  <text x="52" y="429" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">100 by 100, a rectangle 50 wide takes up half of it, however large it is later shown.</text>
  <text x="52" y="450" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start"></text>
  <text x="52" y="471" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">The font size is in those units too, not in typographic points: in a cell of 50, a size</text>
  <text x="52" y="492" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">of 12 takes up almost a quarter of the height.</text>

</svg>
