<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="570" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figure 6 — Fill, stroke and opacity</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">Three distinct opacities, and a thickness that widens the figure.</text>
  <text x="30" y="92" font-size="11" fill="#1b2430" font-weight="650" text-anchor="start">Fill only</text>
  <text x="30" y="108" font-size="9.5" fill="#6b7684" font-weight="400" text-anchor="start">stroke off</text>
  <rect x="30" y="118" width="190" height="150" rx="4" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <circle cx="125" cy="193" r="55" fill="#dc1822" stroke="none" stroke-width="3"/>
  <text x="260" y="92" font-size="11" fill="#1b2430" font-weight="650" text-anchor="start">Stroke only</text>
  <text x="260" y="108" font-size="9.5" fill="#6b7684" font-weight="400" text-anchor="start">fill off</text>
  <rect x="260" y="118" width="190" height="150" rx="4" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <circle cx="355" cy="193" r="55" fill="none" stroke="#1b2430" stroke-width="3"/>
  <text x="490" y="92" font-size="11" fill="#1b2430" font-weight="650" text-anchor="start">Both</text>
  <text x="490" y="108" font-size="9.5" fill="#6b7684" font-weight="400" text-anchor="start">stroke 8 thick</text>
  <rect x="490" y="118" width="190" height="150" rx="4" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <circle cx="585" cy="193" r="55" fill="#dc1822" stroke="#1b2430" stroke-width="8"/>
  <text x="730" y="92" font-size="11" fill="#1b2430" font-weight="650" text-anchor="start">The thickness sits astride</text>
  <rect x="730" y="118" width="180" height="150" rx="4" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <circle cx="820" cy="193" r="46" fill="none" stroke="#1b2430" stroke-width="18" opacity=".35"/>
  <circle cx="820" cy="193" r="46" fill="none" stroke="#3b6ef5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="820" y="258" font-size="9" fill="#6b7684" font-weight="400" text-anchor="middle">half inside, half outside</text>
  <rect x="30" y="300" width="880" height="250" rx="8" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <text x="52" y="330" font-size="12" fill="#1b2430" font-weight="650" text-anchor="start">The three opacities are not the same thing.</text>
  <text x="52" y="352" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">Fill opacity            makes only the inner colour transparent; the stroke stays solid.</text>
  <text x="52" y="374" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">Stroke opacity          makes only the outline transparent; the fill stays solid.</text>
  <text x="52" y="396" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">Overall opacity         fades the element already composed, as one whole. It differs from the</text>
  <text x="52" y="418" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">                                             other two: with those, where stroke and fill overlap,</text>
  <text x="52" y="440" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">                                             the fill shows through the stroke; with this one it does not.</text>
  <text x="52" y="484" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">The stroke thickness is measured astride the outline: half falls inside the figure and half outside.</text>
  <text x="52" y="506" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">A circle of radius 50 with a stroke 20 thick therefore occupies an area of radius 60.</text>

</svg>
