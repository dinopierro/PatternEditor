<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 445" width="940" height="445" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="445" fill="#ffffff"/>
  <text x="30.0" y="34" font-size="17" fill="#1b2430" font-weight="600" text-anchor="start">Figure 9 — A row of the list, piece by piece</text>
  <text x="30.0" y="55" font-size="12.5" fill="#6b7684" font-weight="400" text-anchor="start">Each row is an element of the cell, and the order of the rows is the drawing order.</text>
  <image x="30.0" y="128.0" width="792.0" height="97.3" href="data:image/png;base64,"/>
  <rect x="30.0" y="128.0" width="792.0" height="97.3" fill="none" stroke="#ccd3db" stroke-width="1.2" rx="4"/>
