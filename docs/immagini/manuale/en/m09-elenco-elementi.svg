  <text x="635.1" y="283.1" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <line x1="683.4" y1="278.9" x2="683.4" y2="196.1" stroke="#3b6ef5" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
  <circle cx="683.4" cy="196.1" r="3.4" fill="#3b6ef5" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="683.4" cy="278.9" r="12.5" fill="#3b6ef5" stroke="#ffffff" stroke-width="2"/>
  <text x="683.4" y="283.1" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <line x1="747.6" y1="278.9" x2="747.6" y2="196.1" stroke="#3b6ef5" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
  <circle cx="747.6" cy="196.1" r="3.4" fill="#3b6ef5" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="747.6" cy="278.9" r="12.5" fill="#3b6ef5" stroke="#ffffff" stroke-width="2"/>
  <text x="747.6" y="283.1" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <circle cx="37.5" cy="309.3" r="7.5" fill="#3b6ef5"/>
  <text x="37.5" y="312.3" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="51.0" y="313.340782122905" font-size="10.5" fill="#1b2430" font-weight="400" text-anchor="start">The grip: hold it and drag up or down to change the order</text>
  <circle cx="37.5" cy="329.3" r="7.5" fill="#3b6ef5"/>
  <text x="37.5" y="332.3" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="51.0" y="333.340782122905" font-size="10.5" fill="#1b2430" font-weight="400" text-anchor="start">The icon says the type of element</text>
  <circle cx="37.5" cy="349.3" r="7.5" fill="#3b6ef5"/>
  <text x="37.5" y="352.3" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="51.0" y="353.340782122905" font-size="10.5" fill="#1b2430" font-weight="400" text-anchor="start">The type's name; a click anywhere on the row opens its card</text>
  <circle cx="37.5" cy="369.3" r="7.5" fill="#3b6ef5"/>
  <text x="37.5" y="372.3" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="51.0" y="373.340782122905" font-size="10.5" fill="#1b2430" font-weight="400" text-anchor="start">The arrow is a reminder that the row opens</text>
  <circle cx="37.5" cy="389.3" r="7.5" fill="#3b6ef5"/>
  <text x="37.5" y="392.3" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="51.0" y="393.340782122905" font-size="10.5" fill="#1b2430" font-weight="400" text-anchor="start">Duplicates the element, with the same values</text>
  <circle cx="37.5" cy="409.3" r="7.5" fill="#3b6ef5"/>
  <text x="37.5" y="412.3" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="51.0" y="413.340782122905" font-size="10.5" fill="#1b2430" font-weight="400" text-anchor="start">Deletes the element</text>
</svg>
