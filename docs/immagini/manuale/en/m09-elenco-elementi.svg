  <circle cx="87.8" cy="74.5" r="12.5" fill="#3b6ef5" stroke="#ffffff" stroke-width="2"/>
  <text x="87.8" y="78.7" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
