  <circle cx="270.0" cy="74.5" r="12.5" fill="#3b6ef5" stroke="#ffffff" stroke-width="2"/>
  <text x="270.0" y="78.7" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="635.1" y1="278.9" x2="635.1" y2="196.1" stroke="#3b6ef5" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
