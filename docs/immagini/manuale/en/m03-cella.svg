<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="580" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figure 3 — What the cell is</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">A pattern is one tile repeated endlessly: you draw the tile.</text>
  <text x="30" y="90" font-size="9.5" fill="#6b7684" font-weight="700" text-anchor="start">THE CELL — what you draw</text>
  <rect x="30" y="100" width="200" height="200" rx="4" fill="#fbfcfd" stroke="#3b6ef5" stroke-width="1.6"/>
  <circle cx="130" cy="200" r="60" fill="#dc1822" opacity=".85"/>
  <line x1="30" y1="310" x2="230" y2="310" stroke="#6b7684" stroke-width="1"/>
  <text x="130" y="326" font-size="10" fill="#6b7684" font-weight="400" text-anchor="middle">width = 100</text>
  <line x1="18" y1="100" x2="18" y2="300" stroke="#6b7684" stroke-width="1"/>
  <text x="0" y="0" font-size="10" fill="#6b7684" text-anchor="middle" transform="translate(10,200) rotate(-90)">height = 100</text>
  <text x="280" y="200" font-size="12" fill="#3b6ef5" font-weight="600" text-anchor="start">repeats →</text>
  <text x="400" y="90" font-size="9.5" fill="#6b7684" font-weight="700" text-anchor="start">THE RESULT — what you get</text>
  <rect x="400" y="100" width="400" height="200" rx="4" fill="#fbfcfd" stroke="#ccd3db" stroke-width="1"/>
  <circle cx="450" cy="150" r="60" fill="#dc1822" opacity=".85"/>
  <circle cx="550" cy="150" r="60" fill="#dc1822" opacity=".85"/>
  <circle cx="650" cy="150" r="60" fill="#dc1822" opacity=".85"/>
  <circle cx="750" cy="150" r="60" fill="#dc1822" opacity=".85"/>
  <circle cx="450" cy="250" r="60" fill="#dc1822" opacity=".85"/>
  <circle cx="550" cy="250" r="60" fill="#dc1822" opacity=".85"/>
  <circle cx="650" cy="250" r="60" fill="#dc1822" opacity=".85"/>
  <circle cx="750" cy="250" r="60" fill="#dc1822" opacity=".85"/>
  <rect x="400" y="100" width="100" height="100" fill="none" stroke="#3b6ef5" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="450" y="118" font-size="9" fill="#3b6ef5" font-weight="600" text-anchor="middle">the cell</text>
  <rect x="30" y="350" width="880" height="210" rx="8" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1"/>
  <text x="52" y="378" font-size="12" fill="#1b2430" font-weight="650" text-anchor="start">The edge of the cell is not a wall.</text>
  <text x="52" y="399" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">An element may overhang the cell, and it is not cut off: it reappears from the opposite side of the</text>
  <text x="52" y="420" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">tile next door. That is how continuous motifs are built, the ones where the grid cannot be seen.</text>
  <text x="52" y="462" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">In the figure the circle is centred on the cell with a radius of 60 in a cell of 100: it overhangs on all</text>
  <text x="52" y="483" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">four sides, and in the result the circles touch instead of standing apart.</text>
  <text x="52" y="525" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">Changing the size of the cell does not enlarge the elements: it changes how much space there is between</text>
  <text x="52" y="546" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start">one repetition and the next. To enlarge the motif you use the scale.</text>

</svg>
