<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="620" fill="#ffffff"/>
  <defs>
    <marker id="f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
  </defs>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#1b2430">Figura 7 — Salvataggio, date e recupero dai documenti precedenti</text>
  <text x="40" y="64" font-size="13" fill="#6b7684">L'editor non tocca mai le date: sono responsabilit&#224; del livello di persistenza.</text>

  <!-- flusso di salvataggio -->
  <rect x="40" y="94" width="176" height="76" rx="8" fill="#eaf0ff" stroke="#3b6ef5"/>
  <text x="128" y="120" font-size="12.5" font-weight="700" fill="#1b2430" text-anchor="middle">Editor</text>
  <text x="128" y="140" font-size="10.5" fill="#6b7684" text-anchor="middle">lavora su una copia</text>
  <text x="128" y="155" font-size="10.5" fill="#6b7684" text-anchor="middle">profonda del Pattern</text>

  <path d="M 216 132 L 258 132" stroke="#6b7684" stroke-width="1.6" fill="none" marker-end="url(#f7)"/>
  <text x="237" y="124" font-size="10" fill="#6b7684" text-anchor="middle">Conferma</text>

  <rect x="262" y="94" width="176" height="76" rx="8" fill="#f5f7fa" stroke="#ccd3db"/>
  <text x="350" y="120" font-size="12.5" font-weight="700" fill="#1b2430" text-anchor="middle">Applicazione host</text>
  <text x="350" y="140" font-size="10.5" fill="#6b7684" text-anchor="middle">decide se e dove salvare:</text>
  <text x="350" y="155" font-size="10.5" fill="#6b7684" text-anchor="middle">POST se nuovo, PUT se esistente</text>

  <path d="M 438 132 L 480 132" stroke="#6b7684" stroke-width="1.6" fill="none" marker-end="url(#f7)"/>

  <rect x="484" y="94" width="196" height="76" rx="8" fill="#f5f7fa" stroke="#ccd3db"/>
  <text x="582" y="120" font-size="12.5" font-weight="700" fill="#1b2430" text-anchor="middle">Repository</text>
  <text x="582" y="140" font-size="10.5" fill="#2e7d4f" text-anchor="middle">creazione: CreatedAt = ModifiedAt = ora</text>
  <text x="582" y="155" font-size="10.5" fill="#2e7d4f" text-anchor="middle">modifica: solo ModifiedAt = ora</text>

  <path d="M 680 132 L 722 132" stroke="#6b7684" stroke-width="1.6" fill="none" marker-end="url(#f7)"/>

  <rect x="726" y="94" width="174" height="76" rx="8" fill="#f5f7fa" stroke="#ccd3db"/>
  <text x="813" y="120" font-size="12.5" font-weight="700" fill="#1b2430" text-anchor="middle">{PatternId}.json</text>
  <text x="813" y="140" font-size="10.5" fill="#6b7684" text-anchor="middle">un pattern, un documento,</text>
  <text x="813" y="155" font-size="10.5" fill="#6b7684" text-anchor="middle">un file</text>

  <!-- nota annulla -->
  <rect x="40" y="188" width="640" height="34" rx="6" fill="#fbfcfd" stroke="#e3e6ea"/>
  <text x="56" y="210" font-size="11.5" fill="#1b2430">Aprire un pattern, modificarlo e poi annullare non cambia alcuna data: senza conferma il repository non viene mai chiamato.</text>

  <!-- recupero da uuid -->
  <rect x="40" y="252" width="860" height="216" rx="10" fill="#fdf6e3" stroke="#d0a215"/>
  <text x="60" y="280" font-size="14" font-weight="700" fill="#1b2430">Documenti salvati prima dell'introduzione delle date</text>
  <text x="60" y="302" font-size="12" fill="#1b2430">La data di creazione era gi&#224; nel documento, incisa nell'identificativo: un UUIDv7 inizia con il timestamp Unix in millisecondi della propria generazione.</text>

  <!-- scomposizione uuid -->
  <g font-family="Consolas, monospace">
    <rect x="60" y="322" width="240" height="34" rx="5" fill="#ffffff" stroke="#d0a215" stroke-width="1.6"/>
    <text x="180" y="344" font-size="14" fill="#1b2430" text-anchor="middle">01a08a43-f274</text>
    <rect x="304" y="322" width="316" height="34" rx="5" fill="#ffffff" stroke="#e3e6ea"/>
    <text x="462" y="344" font-size="14" fill="#6b7684" text-anchor="middle">-7e72-8c70-6f70376970bf</text>
  </g>
  <text x="180" y="374" font-size="10.5" fill="#d0a215" text-anchor="middle" font-weight="600">48 bit di timestamp</text>
  <text x="462" y="374" font-size="10.5" fill="#6b7684" text-anchor="middle">versione, variante, casualit&#224;</text>

  <path d="M 180 382 L 180 408" stroke="#6b7684" stroke-width="1.5" fill="none" marker-end="url(#f7)"/>
  <text x="200" y="402" font-size="11" fill="#1b2430">Uuid7.TryGetCreationTime</text>

  <rect x="60" y="412" width="300" height="34" rx="5" fill="#ffffff" stroke="#ccd3db"/>
  <text x="210" y="434" font-size="12.5" fill="#1b2430" text-anchor="middle">CreatedAt = 10/09/2026 09:41:43</text>

  <text x="392" y="424" font-size="11.5" fill="#1b2430">ModifiedAt non &#232; ricavabile da alcun dato esistente: eguaglia la creazione</text>
  <text x="392" y="442" font-size="11.5" fill="#1b2430">finch&#233; il pattern non viene risalvato. Entrambe finiscono nel file al primo</text>
  <text x="392" y="460" font-size="11.5" fill="#1b2430">salvataggio successivo: la ricostruzione avviene una volta sola.</text>

  <!-- decisioni -->
  <rect x="40" y="490" width="422" height="106" rx="8" fill="#ffffff" stroke="#ccd3db"/>
  <text x="60" y="514" font-size="12.5" font-weight="700" fill="#1b2430">Nessuna migrazione manuale</text>
  <text x="60" y="536" font-size="11.5" fill="#1b2430">I file esistenti restano validi cos&#236; come sono. Il campo</text>
  <text x="60" y="554" font-size="11.5" fill="#1b2430">assente non &#232; un errore: viene dedotto alla lettura e</text>
  <text x="60" y="572" font-size="11.5" fill="#1b2430">scritto alla prima occasione utile.</text>

  <rect x="478" y="490" width="422" height="106" rx="8" fill="#ffffff" stroke="#ccd3db"/>
  <text x="498" y="514" font-size="12.5" font-weight="700" fill="#1b2430">La creazione non si riscrive</text>
  <text x="498" y="536" font-size="11.5" fill="#1b2430">In aggiornamento il repository rilegge la data di creazione</text>
  <text x="498" y="554" font-size="11.5" fill="#1b2430">dal documento salvato e ignora quella inviata dal client:</text>
  <text x="498" y="572" font-size="11.5" fill="#1b2430">appartiene al documento, non a chi lo rimanda indietro.</text>
</svg>
