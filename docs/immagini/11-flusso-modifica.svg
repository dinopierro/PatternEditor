  <text x="50.0" y="621.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">Nessun passaggio tocca l'archivio: fino a «Chiudi / Conferma» tutto avviene sulla copia che vive dentro il componente.</text>
  <text x="50.0" y="634.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">Il renderer viene invocato dal rendering di Blazor, non dall'evento: se in un colpo solo cambiano dieci proprietà, il disegno si rifà una volta.</text>
