<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 483" width="940" height="483" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="483" fill="#ffffff"/>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ef5"/></marker></defs>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figura 15 — I quattro punti in cui si scende a JavaScript</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">Tutto il resto è C#. Si chiama JavaScript solo per ciò che il browser non espone altrimenti.</text>
  <rect x="30.0" y="84.0" width="230.0" height="76.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="42.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">PatternPreviewPanel</text>
  <text x="42.0" y="122.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">componente Blazor</text>
  <rect x="300.0" y="84.0" width="300.0" height="76.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="312.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start"></text>
  <text x="312.0" y="104.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">_content/PatternEditor/patternEditorInterop.js</text>
  <text x="312.0" y="124.0" font-size="8.2" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">downloadTextFile(nome, contenuto, tipo)</text>
  <text x="312.0" y="139.0" font-size="8.2" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">copyText(contenuto) → true/false</text>
  <text x="620.0" y="106.0" font-size="8.4" fill="#6b7684" font-weight="700" text-anchor="start">perché:</text>
  <text x="620.0" y="122.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">scaricare un file e scrivere negli appunti sono gesti che</text>
  <text x="620.0" y="134.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">solo il browser può compiere</text>
  <path d="M 260.0 122.0 L 300.0 122.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <rect x="30.0" y="178.0" width="230.0" height="61.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="42.0" y="198.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">VectorElementsPanel</text>
  <text x="42.0" y="216.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">componente Blazor</text>
  <rect x="300.0" y="178.0" width="300.0" height="61.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="312.0" y="198.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start"></text>
  <text x="312.0" y="198.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">_content/PatternEditor/patternEditorInterop.js</text>
  <text x="312.0" y="218.0" font-size="8.2" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">centriDelleRighe(elenco) → double[]</text>
  <text x="620.0" y="200.0" font-size="8.4" fill="#6b7684" font-weight="700" text-anchor="start">perché:</text>
  <text x="620.0" y="216.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">misurare dove sono le righe sullo schermo: la posizione la</text>
  <text x="620.0" y="228.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">conosce solo il documento</text>
  <path d="M 260.0 208.5 L 300.0 208.5" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <rect x="30.0" y="257.0" width="230.0" height="61.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="42.0" y="277.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">MainLayout (host)</text>
  <text x="42.0" y="295.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">componente Blazor</text>
  <rect x="300.0" y="257.0" width="300.0" height="61.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="312.0" y="277.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start"></text>
  <text x="312.0" y="277.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">js/tema.js</text>
  <text x="312.0" y="297.0" font-size="8.2" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">sistemaPreferisceScuro() · leggi() · applica(t)</text>
  <text x="620.0" y="279.0" font-size="8.4" fill="#6b7684" font-weight="700" text-anchor="start">perché:</text>
  <text x="620.0" y="295.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">il tema scelto va ricordato fra una visita e l'altra, e</text>
  <text x="620.0" y="307.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">sta nel browser</text>
  <path d="M 260.0 287.5 L 300.0 287.5" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <rect x="30.0" y="336.0" width="230.0" height="61.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="42.0" y="356.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">PatternsPage (host)</text>
  <text x="42.0" y="374.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">componente Blazor</text>
  <rect x="300.0" y="336.0" width="300.0" height="61.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="312.0" y="356.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start"></text>
  <text x="312.0" y="356.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">js/movimento.js</text>
  <text x="312.0" y="376.0" font-size="8.2" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">riflettore() · origineFinestra() · contatori()</text>
  <text x="620.0" y="358.0" font-size="8.4" fill="#6b7684" font-weight="700" text-anchor="start">perché:</text>
  <text x="620.0" y="374.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">le animazioni della vetrina, che non hanno nulla a che</text>
  <text x="620.0" y="386.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">vedere con la libreria</text>
  <path d="M 260.0 366.5 L 300.0 366.5" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <rect x="30.0" y="419.0" width="880.0" height="40.0" rx="6" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40.0" y="436.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">Ogni modulo si importa una volta sola, alla prima occasione, e viene rilasciato in DisposeAsync: un import per clic lascerebbe dietro</text>
  <text x="40.0" y="449.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">riferimenti che nessuno chiude. I moduli sono ES: le loro funzioni non finiscono su window, e due componenti non possono darsi fastidio.</text>
</svg>
