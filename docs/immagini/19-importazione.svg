<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 541" width="940" height="541" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="541" fill="#ffffff"/>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ef5"/></marker></defs>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figura 19 — Dall'SVG al modello: l'importazione</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">Il percorso inverso della generazione, e le tre decisioni che lo rendono onesto.</text>
  <rect x="30.0" y="84.0" width="200.0" height="150.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="42.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">1 · Il documento</text>
  <text x="42.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">letto con le definizioni di</text>
  <text x="42.0" y="136.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">tipo DISABILITATE: il file</text>
  <text x="42.0" y="150.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">arriva da fuori e non deve</text>
  <text x="42.0" y="164.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">poter far aprire niente</text>
  <text x="42.0" y="206.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">La cella viene dal viewBox,</text>
  <text x="42.0" y="218.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">non dalle misure a schermo.</text>
  <rect x="268.0" y="84.0" width="200.0" height="150.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="280.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">2 · L'albero, percorso</text>
  <text x="280.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">gruppi attraversati</text>
  <text x="280.0" y="136.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">&lt;defs&gt; saltati: definiscono,</text>
  <text x="280.0" y="150.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">non disegnano</text>
  <text x="280.0" y="164.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">stile in linea che vince</text>
  <text x="280.0" y="178.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">sugli attributi</text>
  <text x="280.0" y="218.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Trasformazioni composte.</text>
  <rect x="506.0" y="84.0" width="200.0" height="150.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="518.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">3 · Che cosa entra</text>
  <text x="518.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">un tag entra se il REGISTRO</text>
  <text x="518.0" y="136.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">ha un plugin con quel nome</text>
  <text x="518.0" y="158.0" font-size="8.4" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">&lt;rect&gt; → plugin «rect»</text>
  <text x="518.0" y="174.0" font-size="8.4" fill="#c2701c" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">&lt;use&gt;  → nessuno: fuori</text>
  <text x="518.0" y="196.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Nessun elenco di tipi scritto</text>
  <text x="518.0" y="208.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">nell'importatore: un decimo</text>
  <text x="518.0" y="220.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">elemento entra da solo.</text>
  <rect x="744.0" y="84.0" width="166.0" height="150.0" rx="8" fill="#eef3ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="756.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">4 · Il pattern</text>
  <text x="756.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">non salvato:</text>
  <text x="756.0" y="136.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">si apre nell'editor,</text>
  <text x="756.0" y="150.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">si guarda,</text>
  <text x="756.0" y="164.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">si conferma</text>
  <path d="M 230.0 150.0 L 268.0 150.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <path d="M 468.0 150.0 L 506.0 150.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <path d="M 706.0 150.0 L 744.0 150.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <rect x="30.0" y="262.0" width="430.0" height="180.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="42.0" y="282.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">Come si scrivono le proprietà senza conoscere i tipi</text>
  <text x="44.0" y="296.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">plugin.Create()        → i valori predefiniti del tipo</text>
  <text x="44.0" y="311.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">serializza             → { "type": "rect", "x": 0, "fill": "#3b6ef5", … }</text>
  <text x="44.0" y="326.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">sovrapponi gli attributi del documento, PER NOME</text>
  <text x="44.0" y="341.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  x="12.5"           → "x": 12.5</text>
  <text x="44.0" y="356.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  stroke-width="2"   → "strokeWidth": 2</text>
  <text x="44.0" y="371.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  rx="3"             → la chiave non esiste: si ignora</text>
  <text x="44.0" y="386.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">deserializza           → l'elemento concreto del plugin</text>
  <text x="44.0" y="412.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Ciò che il documento non dice resta al valore del plugin: un SVG che tace</text>
  <text x="44.0" y="424.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">sull'opacità non sta chiedendo un elemento invisibile.</text>
  <rect x="490.0" y="262.0" width="420.0" height="180.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="502.0" y="282.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">Le tre cose che restano fuori, e perché si dicono</text>
  <text x="504.0" y="314.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="start">Rotazioni e inclinazioni</text>
  <text x="504.0" y="328.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">cambierebbero la forma: un rettangolo ruotato non lo è più</text>
  <text x="504.0" y="358.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="start">Gradienti, motivi, ritagli, filtri</text>
  <text x="504.0" y="372.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">il modello non li ha; senza bordo l'elemento sarebbe invisibile</text>
  <text x="504.0" y="402.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="start">Fogli di stile, &lt;use&gt;, &lt;symbol&gt;</text>
  <text x="504.0" y="416.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">richiedono di risolvere riferimenti che il modello non conserva</text>
  <rect x="30.0" y="464.0" width="880.0" height="53.0" rx="6" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40.0" y="481.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">Il documento SVG prodotto dall'applicazione si rilegge: il disegno sta dentro &lt;defs&gt;&lt;pattern&gt;, che di regola non si importa perché</text>
  <text x="40.0" y="494.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">è una definizione — ma lì quella definizione È il pattern, e da lì tornano anche la cella e la trasformazione. Andata e ritorno</text>
  <text x="40.0" y="507.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">restituiscono lo stesso pattern, ed è quello che rende l'SVG un formato di scambio e non solo di uscita.</text>
</svg>
