<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 416" width="940" height="416" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="940" height="416" fill="#ffffff"/>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ef5"/></marker></defs>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1b2430">Figura 14 — Dal JSON al modello e ritorno</text>
  <text x="30" y="55" font-size="12.5" fill="#6b7684">Un tipo che questa installazione non conosce attraversa il sistema intatto.</text>
  <rect x="30.0" y="84.0" width="258.0" height="250.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="42.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">Documento JSON</text>
  <text x="42.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">come sta sul disco</text>
  <text x="42.0" y="140.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">{</text>
  <text x="42.0" y="155.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  "version": 1,</text>
  <text x="42.0" y="170.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  "id": "01a09078-…",</text>
  <text x="42.0" y="185.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  "name": "Briks",</text>
  <text x="42.0" y="200.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  "createdAt": "2026-…Z",</text>
  <text x="42.0" y="215.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">  "definition": {</text>
  <text x="42.0" y="230.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">    "width": 50, "height": 50,</text>
  <text x="42.0" y="245.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">    "elements": [</text>
  <text x="42.0" y="260.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">      { "type": "rect", … },</text>
  <text x="42.0" y="275.0" font-size="8.2" fill="#c2701c" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">      { "type": "runa", … }</text>
  <text x="42.0" y="290.0" font-size="8.2" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">    ] } }</text>
  <rect x="341.0" y="84.0" width="258.0" height="250.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="353.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">PatternSerializer</text>
  <text x="353.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">l'unico punto di traduzione</text>
  <text x="353.0" y="140.0" font-size="9.5" fill="#1b2430" font-weight="700" text-anchor="start">Deserialize</text>
  <text x="353.0" y="158.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">per ogni elemento legge "type" e</text>
  <text x="353.0" y="170.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">chiede al registro chi lo gestisce:</text>
  <text x="353.0" y="190.0" font-size="8.4" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">trovato → il tipo CLR del plugin</text>
  <text x="353.0" y="206.0" font-size="8.4" fill="#c2701c" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">assente → UnknownVectorElement</text>
  <text x="353.0" y="218.0" font-size="8.4" fill="#c2701c" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">          che conserva il JSON grezzo</text>
  <text x="353.0" y="244.0" font-size="9.5" fill="#1b2430" font-weight="700" text-anchor="start">Serialize</text>
  <text x="353.0" y="262.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">riscrive l'elemento sconosciuto</text>
  <text x="353.0" y="274.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">esattamente com'era arrivato.</text>
  <text x="353.0" y="296.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">Date sempre in UTC, formato "O";</text>
  <text x="353.0" y="308.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">numeri con la cultura invariante.</text>
  <rect x="652.0" y="84.0" width="258.0" height="250.0" rx="8" fill="#ffffff" stroke="#ccd3db" stroke-width="1.5"/>
  <text x="664.0" y="104.0" font-size="11" fill="#1b2430" font-weight="700" text-anchor="start">Modello in memoria</text>
  <text x="664.0" y="122.0" font-size="9" fill="#6b7684" font-weight="400" text-anchor="start">quello che l'editor manipola</text>
  <text x="664.0" y="140.0" font-size="9" fill="#1b2430" font-weight="700" text-anchor="start" font-family="Consolas, ui-monospace, monospace">Pattern</text>
  <text x="664.0" y="158.0" font-size="8.4" fill="#1b2430" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace"> └ PatternDefinition</text>
  <text x="664.0" y="174.0" font-size="8.4" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">     ├ RectElement</text>
  <text x="664.0" y="190.0" font-size="8.4" fill="#2f8f5b" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">     ├ LineElement × 5</text>
  <text x="664.0" y="206.0" font-size="8.4" fill="#c2701c" font-weight="400" text-anchor="start" font-family="Consolas, ui-monospace, monospace">     └ UnknownVectorElement</text>
  <text x="664.0" y="226.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">L'elemento sconosciuto non si può</text>
  <text x="664.0" y="238.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">modificare e non viene disegnato,</text>
  <text x="664.0" y="250.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">ma resta nell'elenco e viene</text>
  <text x="664.0" y="262.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">risalvato: un'installazione senza</text>
  <text x="664.0" y="274.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">il plugin «runa» non distrugge il</text>
  <text x="664.0" y="286.0" font-size="8.4" fill="#6b7684" font-weight="400" text-anchor="start">lavoro di chi ce l'ha.</text>
  <path d="M 288.0 170.0 L 341.0 170.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="314.0" y="162.0" font-size="8.2" fill="#3b6ef5" font-weight="600" text-anchor="middle">legge</text>
  <path d="M 599.0 170.0 L 652.0 170.0" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <path d="M 652 250 L 599 250" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <path d="M 341 250 L 288 250" fill="none" stroke="#3b6ef5" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="314.0" y="268.0" font-size="8.2" fill="#3b6ef5" font-weight="600" text-anchor="middle">riscrive</text>
  <rect x="30.0" y="352.0" width="880.0" height="40.0" rx="6" fill="#fbfcfd" stroke="#e3e6ea" stroke-width="1.2"/>
  <text x="40.0" y="369.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">In lettura ogni campo assente ha un valore di ripiego: un documento più povero si apre, non esplode. Un documento senza "id" invece</text>
  <text x="40.0" y="382.0" font-size="8.8" fill="#6b7684" font-weight="400" text-anchor="start">viene rifiutato, perché senza identificativo non si saprebbe che cosa si sta aprendo né dove risalvarlo.</text>
</svg>
